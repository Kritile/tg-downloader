services:
  postgres:
    image: postgres:15-alpine
    container_name: mediaharvester-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mediaharvester
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: mediaharvester-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  telegram-bot-api:
    container_name: mediaharvester-telegram-bot-api
    image: aiogram/telegram-bot-api:latest
    network_mode: service:telegram-vpn
    depends_on:
      telegram-vpn:
        condition: service_healthy
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_PORT: "8081"
      TELEGRAM_WORK_DIR: /var/lib/telegram-bot-api
      TELEGRAM_TEMP_DIR: /var/lib/telegram-bot-api/temp
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
      - bot_downloads:/downloads
    restart: unless-stopped

  telegram-vpn:
    build:
      context: .
      dockerfile: docker/telegram-vpn/Dockerfile
    container_name: mediaharvester-telegram-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      WG_QUICK_USERSPACE_IMPLEMENTATION: amneziawg-go
    volumes:
      - ${TELEGRAM_AWG_CONFIG_PATH:-./docker/telegram-vpn/config/awg0.conf}:/etc/amneziawg/awg0.conf:ro
    networks:
      internal:
        aliases:
          - telegram-bot-api
    healthcheck:
      test: ["CMD-SHELL", "ip link show awg0 >/dev/null 2>&1 && ip rule show | grep -q '51820'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/bot/Dockerfile
    container_name: mediaharvester-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/mediaharvester?sslmode=disable
    command: ["./migrate"]
    restart: "no"
    networks:
      - internal

  bot:
    build:
      context: .
      dockerfile: docker/bot/Dockerfile
    container_name: mediaharvester-bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      telegram-bot-api:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      - BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN}
      - TELEGRAM_API_URL=${TELEGRAM_API_URL:-http://telegram-bot-api:8081}
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/mediaharvester?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - GLOBAL_DEFAULT_DAILY_LIMIT=${GLOBAL_DEFAULT_DAILY_LIMIT:-10}
      - GLOBAL_DEFAULT_MONTHLY_LIMIT=${GLOBAL_DEFAULT_MONTHLY_LIMIT:-100}
      - WORKER_COUNT=${WORKER_COUNT:-3}
      - XRAY_SOCKS5_PROXY=${XRAY_SOCKS5_PROXY}
    volumes:
      - bot_downloads:/downloads
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "mediaharvester-bot"]
      interval: 30s
      timeout: 10s
      retries: 3

  admin:
    build:
      context: .
      dockerfile: docker/admin/Dockerfile
    container_name: mediaharvester-admin
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/mediaharvester?sslmode=disable
      - ADMIN_PORT=${ADMIN_PORT:-8080}
      - SESSION_SECRET=${SESSION_SECRET:-change_this_in_production}
    ports:
      - "${ADMIN_PORT:-8080}:8080"
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.250.0/24

volumes:
  postgres_data:
  redis_data:
  bot_downloads:
  telegram_bot_api_data:
