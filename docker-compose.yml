services:
  xray-client:
    image: teddysun/xray
    container_name: mediaharvester-xray
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "pgrep", "-f", "xray"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: mediaharvester-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mediaharvester
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: mediaharvester-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  migrate:
    build:
      context: .
      dockerfile: docker/bot/Dockerfile
    container_name: mediaharvester-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/mediaharvester?sslmode=disable
    command: ["./migrate"]
    restart: "no"

  bot:
    build:
      context: .
      dockerfile: docker/bot/Dockerfile
    container_name: mediaharvester-bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      xray-client:
        condition: service_healthy
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/mediaharvester?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - GLOBAL_DEFAULT_DAILY_LIMIT=${GLOBAL_DEFAULT_DAILY_LIMIT:-10}
      - GLOBAL_DEFAULT_MONTHLY_LIMIT=${GLOBAL_DEFAULT_MONTHLY_LIMIT:-100}
      - WORKER_COUNT=${WORKER_COUNT:-3}
      - XRAY_SOCKS5_PROXY=xray-client:10808
    volumes:
      - bot_downloads:/tmp/downloads
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "mediaharvester-bot"]
      interval: 30s
      timeout: 10s
      retries: 3

  admin:
    build:
      context: .
      dockerfile: docker/admin/Dockerfile
    container_name: mediaharvester-admin
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/mediaharvester?sslmode=disable
      - ADMIN_PORT=${ADMIN_PORT:-8080}
      - SESSION_SECRET=${SESSION_SECRET:-change_this_in_production}
    ports:
      - "${ADMIN_PORT:-8080}:8080"
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  bot_downloads:
