<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }} - MediaHarvester Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-gray-100">
    <div class="flex h-screen">
        <div class="w-64 bg-gray-800 text-white">
            <div class="p-4">
                <h1 class="text-xl font-bold">MediaHarvester</h1>
                <p class="text-gray-400 text-sm mt-1">Admin Panel</p>
            </div>
            <nav class="mt-8">
                <a href="/dashboard" class="block py-3 px-4 {{ if eq .current_page "dashboard" }}bg-gray-700{{ end }} hover:bg-gray-700 transition">📊 Dashboard</a>
                <a href="/users" class="block py-3 px-4 {{ if eq .current_page "users" }}bg-gray-700{{ end }} hover:bg-gray-700 transition">👥 Users</a>
                <a href="/jobs" class="block py-3 px-4 {{ if eq .current_page "jobs" }}bg-gray-700{{ end }} hover:bg-gray-700 transition">🧰 Jobs</a>
                <a href="/settings" class="block py-3 px-4 {{ if eq .current_page "settings" }}bg-gray-700{{ end }} hover:bg-gray-700 transition">⚙️ Settings</a>
                <a href="/stats" class="block py-3 px-4 {{ if eq .current_page "stats" }}bg-gray-700{{ end }} hover:bg-gray-700 transition">📈 Statistics</a>
                <form action="/logout" method="POST" class="mt-8">
                    <input type="hidden" name="csrf_token" value="{{ .csrf_token }}">
                    <button class="w-full text-left py-3 px-4 hover:bg-red-600 transition text-red-400 hover:text-white">🚪 Logout</button>
                </form>
            </nav>
        </div>

        <div class="flex-1 overflow-auto">
            <div class="p-8">{{ .content }}</div>
        </div>
    </div>
</body>
</html>
